<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mohammed Elmouge - CV</title>
<link id="theme-css" rel="stylesheet" href="">
<link rel="stylesheet" href="cv.css">
<style>
  .theme-selector { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  .theme-btn { padding: 6px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-muted); font-size: 13px; cursor: pointer; transition: all 0.2s; font-family: inherit; }
  .theme-btn:hover { border-color: var(--accent); color: var(--accent); }
  .theme-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  #loading { text-align: center; padding: 80px 20px; color: var(--text-dim, #64748b); font-size: 18px; }
</style>
</head>
<body>
<div class="container" id="app">
  <div id="loading">Loading CV...</div>
</div>

<script>
const THEMES = {
  dark: 'theme-dark.css',
  light: 'theme-light.css',
  ocean: 'theme-ocean.css'
};

function loadCSS(href) {
  const link = document.getElementById('theme-css');
  link.href = href;
}

function setTheme(name) {
  loadCSS(THEMES[name]);
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.theme === name));
}

function renderCV(data) {
  const app = document.getElementById('app');
  const p = data.personal;

  let projectsHTML = data.projects.map(pr => `
    <div class="project">
      <div class="project-header">
        <h3>${pr.name}</h3>
        ${pr.url ? `<a href="${pr.url}" target="_blank" class="project-link">github ↗</a>` : ''}
      </div>
      ${pr.tech ? `<div class="tech">${pr.tech.map(t => `<span>${t}</span>`).join('')}</div>` : ''}
      <p>${pr.description}</p>
      ${pr.features ? `<ul class="features">${pr.features.map(f => `<li>${f}</li>`).join('')}</ul>` : ''}
    </div>
  `).join('');

  let skillsHTML = data.skills.map(s => `
    <div class="skill-cat">
      <h4>${s.category}</h4>
      <div class="skill-tags">${s.tags.map(t => `<span class="skill-tag">${t}</span>`).join('')}</div>
    </div>
  `).join('');

  let expHTML = data.experience.map(e => `
    <div class="exp-item">
      <div class="exp-dot"></div>
      <div class="exp-content">
        <h3>${e.title}</h3>
        <div class="meta">${e.meta}</div>
        <p>${e.description}</p>
      </div>
    </div>
  `).join('');

  let eduHTML = data.education.map(e => `
    <div class="ed-item">
      <h3>${e.degree}</h3>
      <div class="meta">${e.meta}</div>
    </div>
  `).join('');

  let langHTML = data.languages.map(l => `
    <div class="lang-item"><span class="lang-name">${l.name}</span><span class="lang-level">${l.level}</span></div>
  `).join('');

  let themeBtns = Object.keys(THEMES).map(t =>
    `<button class="theme-btn${t === data.theme ? ' active' : ''}" data-theme="${t}" onclick="setTheme('${t}')">${t.toUpperCase()}</button>`
  ).join('');

  app.innerHTML = `
    <div style="padding:20px 48px 0;text-align:center">${themeBtns}</div>
    <div class="header">
      <div class="header-content">
        <div>
          <h1>${p.name.split(' ')[0]} <span>${p.name.split(' ').slice(1).join(' ')}</span></h1>
          <div class="title">${p.title}</div>
          <div class="subtitle">${p.subtitle}</div>
          <div class="contact-info">
            <a href="mailto:${p.email}">${p.email}</a>
            <a href="tel:${p.phone}">${p.phone}</a>
            <span>${p.location}</span>
            <a href="${p.github}" target="_blank">github.com/jminoktit</a>
          </div>
        </div>
        <div class="avatar">${p.monogram}</div>
      </div>
    </div>
    <div class="body">
      <section>
        <div class="section-title">Summary</div>
        <div class="summary">${data.summary}</div>
      </section>
      <section>
        <div class="section-title">Skills</div>
        <div class="skills-grid">${skillsHTML}</div>
      </section>
      <section>
        <div class="section-title">Projects</div>
        ${projectsHTML}
      </section>
      <section>
        <div class="section-title">Experience</div>
        ${expHTML}
      </section>
      <section>
        <div class="section-title">Education</div>
        ${eduHTML}
      </section>
      <section>
        <div class="section-title">Languages</div>
        ${langHTML}
      </section>
    </div>
  `;

  loadCSS(THEMES[data.theme] || THEMES.dark);
}

fetch('cv-data.json')
  .then(r => r.json())
  .then(data => renderCV(data))
  .catch(err => {
    document.getElementById('app').innerHTML = `
      <div style="padding:40px;text-align:center;color:var(--text-dim,#64748b)">
        <p style="font-size:18px;margin-bottom:12px;">Could not load cv-data.json</p>
        <p style="font-size:14px;color:var(--text-dim,#64748b)">${err.message}</p>
      </div>`;
  });
</script>
</body>
</html>
